# Fetches the plans every 30 minutes and publishes the page on GitHub Pages.
# The history for the forecast lives in the branch "data" (created on the first run).
# Once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Pages

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # push the history to the branch "data"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@v4

      - name: Get the history (branch data)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git clone -q --depth 1 --branch data "$REPO_URL" data
          else
            mkdir data
            git -C data init -q -b data
            git -C data remote add origin "$REPO_URL"
          fi

      - name: Fetch the plans
        run: |
          mkdir -p site
          cp -r www/. site/
          rm -f site/config.example.json
          STATE_DIRECTORY="$PWD/data" python3 -I fetch_baeder.py site/plan.json

      - name: Save the history
        run: |
          cd data
          git add -A
          if git diff --cached --quiet; then echo "no change in the plans"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Verlauf $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
